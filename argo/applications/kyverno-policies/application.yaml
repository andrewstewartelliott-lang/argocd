apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    release: kyverno-policies
spec:
  destination:
    name: in-cluster
  project: default
  source:
    repoURL: 'https://github.com/andrewstewartelliott-lang/kyverno-policies.git'
    targetRevision: main
    path: .
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
