# Registers the kro OCI Helm registry with Argo CD (OCI repos must be declared with enableOCI)
apiVersion: v1
kind: Secret
metadata:
  name: repo-kro-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: kro
  type: helm
  url: registry.k8s.io/kro/charts
  enableOCI: "true"
---
# Equivalent of:
#   helm install kro oci://registry.k8s.io/kro/charts/kro --namespace kro-system --create-namespace
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    release: kro
spec:
  destination:
    name: in-cluster
    namespace: kro-system
  project: default
  source:
    repoURL: registry.k8s.io/kro/charts
    chart: kro
    targetRevision: 0.5.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
