apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickstack-operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    app.kubernetes.io/managed-by: "Helm"
    meta.helm.sh/release-name: clickstack-operators
    meta.helm.sh/release-namespace: argocd
  labels:
    release: clickstack-operators
spec:
  destination:
    name: in-cluster
    namespace: argocd
  project: default
  source:
    repoURL: 'https://clickhouse.github.io/ClickStack-helm-charts'
    targetRevision: 1.1.0
    chart: clickstack-operators
  syncPolicy:
    automated:
      prune: true
      selfHeal: true